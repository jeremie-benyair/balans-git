[project]
name = "tfproject"
version = "0.1.0"
description = "Projet TensorFlow collaboratif"
requires-python = ">=3.10"
dependencies = ["tensorflow>=2.16,<3", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
